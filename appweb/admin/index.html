<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Le Défi du 1 $</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 20px; color: #00ff88; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: 800; color: #00ff88; }
    .stat-label { font-size: 11px; color: #666; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
    th { color: #888; font-weight: 600; text-transform: uppercase; font-size: 11px; }
    td { color: #ccc; }
    .code { color: #00ff88; font-family: monospace; }
    .actions { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn { padding: 8px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #ccc; cursor: pointer; font-size: 13px; }
    .btn:hover { background: #2a2a2a; }
    .btn-primary { background: #00ff88; color: #0a0a0a; border: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin — Le Défi du 1 $</h1>
    <div class="actions">
      <button class="btn btn-primary" onclick="refresh()">Actualiser</button>
      <button class="btn" onclick="exportCSV()">Exporter CSV</button>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <h3 style="color:#888;font-size:12px;text-transform:uppercase;margin:20px 0 8px">Derniers participants</h3>
    <table id="participantsTable">
      <thead><tr><th>Email</th><th>Code</th><th>Entrée</th><th>Référé par</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    const API = window.location.origin;
    let allData = null;

    function refresh() {
      Promise.all([
        fetch(API + '/api/stats').then(r => r.json()),
        fetch(API + '/api/admin/participants').then(r => r.json()),
        fetch(API + '/api/admin/codes').then(r => r.json())
      ]).then(([stats, parts, codes]) => {
        allData = { stats, parts, codes };

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="stat-value">$${stats.totalDollar}</div><div class="stat-label">Compteur</div></div>
          <div class="stat-card"><div class="stat-value">${stats.totalParticipants}</div><div class="stat-label">Participants</div></div>
          <div class="stat-card"><div class="stat-value">${stats.activeCodes}</div><div class="stat-label">Codes actifs</div></div>
          <div class="stat-card"><div class="stat-value">${stats.shares}</div><div class="stat-label">Partages</div></div>
        `;

        const tbody = document.querySelector('#participantsTable tbody');
        tbody.innerHTML = parts.participants.map(p => `
          <tr>
            <td>${p.email}</td>
            <td class="code">${p.code}</td>
            <td>${new Date(p.joinedAt).toLocaleString('fr-CA')}</td>
            <td>${p.referrer || '—'}</td>
          </tr>
        `).join('');
      });
    }

    function exportCSV() {
      if (!allData) { refresh(); return; }
      const rows = [['email', 'code', 'joined_at', 'referrer']];
      allData.parts.participants.forEach(p => {
        rows.push([p.email, p.code, p.joinedAt, p.referrer || '']);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'participants.csv';
      a.click();
    }

    refresh();
    setInterval(refresh, 10000);
  </script>
</body>
</html>
